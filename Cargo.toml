[package]
name = "mandrake"
version = "0.1.0"
edition = "2024"

[features]
default = ["native-inputs", "sketchlib", "cli"]
native-inputs = ["dep:bzip2", "needletail/compression"]
sketchlib = ["dep:sketchlib"]
progress = ["dep:indicatif"]
cli = ["native-inputs", "sketchlib", "dep:clap", "dep:simple_logger", "progress"]

[dependencies]
anyhow = "1"
bzip2 = { version = "0.4", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
csv = "1.4"
simple_logger = { version = "4.3", optional = true }
hashbrown = "0.14"
hdbscan = { version = "=0.12.0", default-features = false, features = ["serial"] }
indicatif = { version = "0.17", optional = true }
log = "0.4"
ndarray = "0.16"
needletail = { version = "0.5", default-features = false }
rayon = "1.10"
rand_xoshiro = "0.6"
roaring = "0.10"
sketchlib = { version = "0.4.1", optional = true }
web-time = "1.1"

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook = "0.1"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
wasm-bindgen = "0.2"
wasm-bindgen-file-reader = "1"
web-sys = { version = "0.3", features = ["File"] }

[[bin]]
name = "mandrake"
path = "src/main.rs"
required-features = ["cli"]
